version: '3.8'

services:
  app:
    build: .
    container_name: prescription-cleaner
    restart: always
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=YOUR_GEMINI_API_KEY_HERE
      - GOOGLE_API_KEY=YOUR_GOOGLE_API_KEY_HERE
      - GEMINI_MODEL=gemini-2.5-pro
    volumes:
      - ./.streamlit:/app/.streamlit
